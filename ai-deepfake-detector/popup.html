<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Deepfake Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .settings-panel {
            background: var(--surface, #1a1a2e);
            border: 1px solid var(--border, #2a2a4a);
            border-radius: 10px;
            padding: 16px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .settings-panel h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .settings-panel label {
            font-size: 11px;
            color: #888;
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-panel input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border, #2a2a4a);
            background: var(--bg, #0f0f1a);
            color: #fff;
            font-size: 12px;
            font-family: monospace;
            outline: none;
        }

        .settings-panel input:focus {
            border-color: #4facfe;
        }

        .save-btn {
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .save-status {
            font-size: 11px;
            text-align: center;
            color: #00e5a0;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="url(#gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f2fe" />
                            <stop offset="100%" stop-color="#4facfe" />
                        </linearGradient>
                    </defs>
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                <h1>DeepGuard AI</h1>
            </div>
            <p class="subtitle">Protecting truth in media</p>
        </header>

        <main>
            <div class="action-card">
                <p>Analyze the current visible area for AI manipulation.</p>
                <button id="capture-btn" class="primary-btn">
                    <span class="btn-icon">📷</span> Capture & Analyze
                </button>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Analyzing image structure...</p>
            </div>

            <div id="results" class="results-card hidden">
                <div class="result-header">
                    <h2 id="result-title">Analysis Complete</h2>
                    <span id="result-badge" class="badge"></span>
                </div>
                
                <div class="score-container">
                    <div class="circular-chart">
                        <svg viewBox="0 0 36 36" class="circular-chart-svg">
                            <path class="circle-bg"
                                d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path id="score-circle" class="circle"
                                stroke-dasharray="0, 100"
                                d="M18 2.0845
                                a 15.9155 15.9155 0 0 1 0 31.831
                                a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <text id="score-text" x="18" y="20.35" class="percentage">0%</text>
                        </svg>
                    </div>
                    <p class="score-label">AI Generation Probability</p>
                </div>

                <div class="explanation-box">
                    <h3>Gemini Insights</h3>
                    <p id="explanation-text"></p>
                </div>
                
                <div id="sources-box" class="sources-box hidden">
                    <h3>Related Sources</h3>
                    <ul id="sources-list"></ul>
                </div>
            </div>

            <!-- Settings Panel (hidden by default) -->
            <div id="settings-panel" class="settings-panel hidden">
                <h3>API Keys</h3>
                <div>
                    <label>Gemini API Key</label>
                    <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." autocomplete="off" />
                </div>
                <div>
                    <label>Reality Defender API Key</label>
                    <input type="password" id="rdKeyInput" placeholder="rd_..." autocomplete="off" />
                </div>
                <button class="save-btn" id="saveKeys">Save Keys</button>
                <p class="save-status" id="save-status"></p>
            </div>
        </main>
        
        <footer>
            <a href="#" id="settings-link">Settings & API Keys</a>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
