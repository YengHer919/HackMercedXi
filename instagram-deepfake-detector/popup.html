<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deepfake Detector</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #262626;
    }
    .header {
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .content {
      padding: 24px 20px;
      text-align: center;
    }
    .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .status {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .description {
      font-size: 13px;
      color: #8e8e8e;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #262626;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dbdbdb;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      border-color: #a8a8a8;
    }
    .input-group .helper-text {
      font-size: 11px;
      color: #8e8e8e;
      margin-top: 4px;
      display: block;
    }
    .btn {
      display: inline-block;
      background-color: #0095f6;
      color: white;
      border: none;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #1877f2;
    }
    .btn:disabled {
      background-color: #b2dffc;
      cursor: not-allowed;
    }
    .save-status {
      font-size: 12px;
      color: #00ca4e;
      margin-top: 8px;
      min-height: 15px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .save-status.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Deepfake Detector</h1>
  </div>
  <div class="content">
    <div class="icon">✨</div>
    <div class="status">Gemini API Configuration</div>
    <div class="description">
      Enter your Google Gemini API key below to enable AI-powered deepfake detection on Instagram.
    </div>
    
    <div class="input-group">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." autocomplete="off">
      <span class="helper-text">Your key is stored locally in your browser.</span>
    </div>
    
    <button id="saveBtn" class="btn">Save & Activate</button>
    <div id="saveStatus" class="save-status">Settings saved successfully!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
